name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Build
        run: mvn -B -ntp compile

      - name: Run unit tests (skip device-dependent integration tests)
        run: >
          mvn -B -ntp test
          -Dtest='!*DeviceTest,!*NetworkDiagnosticTest,!ManualDeviceTest,!ComprehensiveDeviceTest,!UserRetrievalTest,!DebugUserBytes,!ZKTecoDeviceServiceTest,!MultiDeviceTest,!TestStrings'

      - name: Verify package
        run: mvn -B -ntp -DskipTests package
